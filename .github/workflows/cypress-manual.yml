name: Cypress - execucao manual

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cypress:
    name: Automation Exercise - 10 casos
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Obter codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias e executar Cypress
        uses: cypress-io/github-action@v6
        with:
          install-command: npm ci
          command: npm test

      - name: Publicar relatorio Mochawesome e capturas
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: mochawesome-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            cypress/reports/html/
            cypress/screenshots/
          if-no-files-found: warn
          retention-days: 14